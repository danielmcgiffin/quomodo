name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: cloudflare-production-deploy
  cancel-in-progress: true

env:
  PUBLIC_SUPABASE_URL: "https://fake_test_url.supabase.co"
  PUBLIC_SUPABASE_ANON_KEY: "fake_anon_key"
  PRIVATE_SUPABASE_SERVICE_ROLE: "fake_service_role"
  PRIVATE_STRIPE_API_KEY: "fake_strip_api_key"

jobs:
  deploy:
    name: Deploy production worker
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Cloudflare bundle
        run: npm run build

      - name: Verify Cloudflare API token is present
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Missing required GitHub secret: CLOUDFLARE_API_TOKEN (or CF_API_TOKEN)"
            exit 1
          fi

      - name: Verify Cloudflare auth
        run: npx wrangler whoami

      - name: Deploy to Cloudflare
        run: npx wrangler deploy
