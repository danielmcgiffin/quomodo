name: Tests

on: [push, pull_request]

env:
  # Prefer secrets; fall back to fake values so unit tests can still run in forks.
  PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL || 'https://fake_test_url.supabase.co' }}
  PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY || 'fake_anon_key' }}
  PRIVATE_SUPABASE_SERVICE_ROLE: ${{ secrets.PRIVATE_SUPABASE_SERVICE_ROLE || 'fake_service_role' }}
  PRIVATE_STRIPE_API_KEY: ${{ secrets.PRIVATE_STRIPE_API_KEY || 'fake_strip_api_key' }}

  # Authenticated E2E prerequisites (required for Playwright app/billing/crud suites).
  E2E_EMAIL: ${{ secrets.E2E_EMAIL || '' }}
  E2E_PASSWORD: ${{ secrets.E2E_PASSWORD || '' }}
  E2E_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_PUBLIC_SUPABASE_URL || '' }}
  E2E_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_PUBLIC_SUPABASE_ANON_KEY || '' }}
  E2E_PRIVATE_SUPABASE_SERVICE_ROLE: ${{ secrets.E2E_PRIVATE_SUPABASE_SERVICE_ROLE || '' }}
  E2E_PRIVATE_STRIPE_API_KEY: ${{ secrets.E2E_PRIVATE_STRIPE_API_KEY || '' }}

jobs:
  build_and_test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: NPM install
        run: npm install

      - name: Typecheck (svelte-check)
        run: npm run check

      - name: Tests
        run: npm run test_run

      - name: Install Playwright (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Validate authenticated E2E env
        run: node scripts/require-e2e-env.mjs

      - name: Seed E2E fixtures
        run: npm run seed:e2e
        env:
          PUBLIC_SUPABASE_URL: ${{ env.E2E_PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ env.E2E_PUBLIC_SUPABASE_ANON_KEY }}
          PRIVATE_SUPABASE_SERVICE_ROLE: ${{ env.E2E_PRIVATE_SUPABASE_SERVICE_ROLE }}
          PRIVATE_STRIPE_API_KEY: ${{ env.E2E_PRIVATE_STRIPE_API_KEY || env.PRIVATE_STRIPE_API_KEY }}

      - name: E2E (Playwright)
        run: npm run test:e2e
        env:
          PUBLIC_SUPABASE_URL: ${{ env.E2E_PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ env.E2E_PUBLIC_SUPABASE_ANON_KEY }}
          PRIVATE_SUPABASE_SERVICE_ROLE: ${{ env.E2E_PRIVATE_SUPABASE_SERVICE_ROLE }}
          PRIVATE_STRIPE_API_KEY: ${{ env.E2E_PRIVATE_STRIPE_API_KEY || env.PRIVATE_STRIPE_API_KEY }}
